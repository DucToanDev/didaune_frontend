<div class="admin-shell">
  <!-- ── Mobile top bar ── -->
  <header class="admin-topbar xl:hidden">
    <button type="button" (click)="toggleMobileSidebar()" class="topbar-btn">
      <i class="fa-solid fa-bars"></i>
    </button>
    <a href="/" class="topbar-brand"><img src="logo.svg" alt="didaune" /></a>
    <div class="topbar-spacer"></div>
  </header>

  <!-- ── Mobile overlay ── -->
  <div *ngIf="mobileSidebarOpen()" class="sidebar-overlay xl:hidden" (click)="toggleMobileSidebar()">
    <nav class="sidebar sidebar--mobile" (click)="$event.stopPropagation()">
      <div class="sidebar-head">
        <img src="logo.svg" alt="didaune" class="sidebar-logo sidebar-logo--light" />
        <button type="button" (click)="toggleMobileSidebar()" class="topbar-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <ul class="sidebar-nav">
        <li *ngFor="let m of menus">
          <a [routerLink]="m.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: m.route === '/admin' }" (click)="toggleMobileSidebar()">
            <i [class]="'fa-solid ' + m.icon"></i><span>{{ m.label }}</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>

  <div class="admin-layout">
    <!-- ── Desktop sidebar ── -->
    <nav class="sidebar hidden xl:flex" [class.sidebar--collapsed]="!sidebarOpen()">
      <div class="sidebar-head">
        <img *ngIf="sidebarOpen()" src="logo.svg" alt="didaune" class="sidebar-logo" />
        <button type="button" (click)="toggleSidebar()" class="sidebar-toggle">
          <i [class]="'fa-solid ' + (sidebarOpen() ? 'fa-chevron-left' : 'fa-chevron-right')"></i>
        </button>
      </div>

      <ul class="sidebar-nav">
        <li *ngFor="let m of menus">
          <a [routerLink]="m.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: m.route === '/admin' }" [title]="!sidebarOpen() ? m.label : ''">
            <i [class]="'fa-solid ' + m.icon"></i>
            <span *ngIf="sidebarOpen()">{{ m.label }}</span>
          </a>
        </li>
      </ul>

      <div *ngIf="sidebarOpen()" class="sidebar-footer">
        <span class="sidebar-version">didaune admin <em>v2</em></span>
      </div>
    </nav>

    <!-- ── Page content ── -->
    <main class="admin-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
