<div class="admin-shell min-h-screen bg-slate-50 text-slate-900">
  <div class="mx-auto flex min-h-screen max-w-[1920px]">
    <aside class="admin-sidebar sticky top-0 hidden h-screen w-[260px] shrink-0 flex-col border-r border-slate-300 text-slate-700 xl:flex">
      <div class="border-b border-slate-300 px-6 py-6">
        <div class="flex items-center gap-3">
          <a href="/" class="flex min-w-0 items-center gap- p-0 text-center">
            <img src="logo.svg" alt="logo" class="h-12 w-auto max-w-[210px] md:h-11 md:max-w-[220px] lg:h-14 lg:max-w-[260px]" />
          </a>
        </div>
      </div>

      <nav class="flex-1 space-y-2 px-4 py-6">
        <a
          *ngFor="let menu of menus"
          [routerLink]="menu.route"
          routerLinkActive="admin-nav-active"
          [routerLinkActiveOptions]="{ exact: menu.route === '/admin' }"
          class="admin-nav-link flex w-full items-center gap-4 rounded-2xl px-4 py-3 text-left transition"
        >
          <i [class]="'fa-solid ' + menu.icon + ' w-5 text-center'"></i>
          <span class="text-sm font-semibold">{{ menu.label }}</span>
        </a>
      </nav>

      
    </aside>

    <main class="min-w-0 flex-1 p-4 lg:p-6 xl:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
