<div class="mx-auto max-w-4xl px-4 pb-24 pt-6 md:px-6 md:pb-12">
  <section class="rounded-3xl bg-slate-900 p-6 text-white md:p-8">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-300">Partner flow</p>
    <h1 class="mt-2 text-2xl font-black md:text-3xl">Dang ky dia diem chu quan</h1>
    <p class="mt-3 max-w-2xl text-sm text-slate-300 md:text-base">
      Gui thong tin co ban de DiDauNe duyet va dua dia diem len dung danh muc.
    </p>
  </section>

  <section class="mt-6 rounded-3xl border border-slate-200 bg-white p-5 shadow-sm md:p-7">
    <div *ngIf="submitted()" class="rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-emerald-800">
      Gui thong tin thanh cong.
      <span *ngIf="submissionId()" class="font-semibold">Ma yeu cau: {{ submissionId() }}</span>
    </div>

    <form *ngIf="!submitted()" [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <div class="grid gap-4 md:grid-cols-2">
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-slate-700">Ten nguoi lien he *</span>
          <input formControlName="contact_name" type="text"
            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100" />
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-slate-700">So dien thoai *</span>
          <input formControlName="contact_phone" type="text"
            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100" />
        </label>
      </div>

      <div class="grid gap-4 md:grid-cols-2">
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-slate-700">Email</span>
          <input formControlName="contact_email" type="email"
            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100" />
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-slate-700">Ten dia diem *</span>
          <input formControlName="name" type="text"
            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100" />
        </label>
      </div>

      <div>
        <span class="mb-2 block text-sm font-semibold text-slate-700">Danh muc *</span>
        <div class="grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-5">
          <button *ngFor="let category of categories" type="button" (click)="form.controls.category.setValue(category.id)"
            [class]="form.controls.category.value === category.id
              ? 'border-orange-300 bg-orange-50 text-orange-600'
              : 'border-slate-200 bg-white text-slate-600'"
            class="inline-flex items-center justify-center gap-2 rounded-xl border px-3 py-2 text-sm font-semibold transition hover:border-orange-200">
            <i [class]="'fa-solid ' + category.icon"></i>
            <span>{{ category.label }}</span>
          </button>
        </div>
      </div>

      <div class="grid gap-4 md:grid-cols-3">
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-slate-700">Thanh pho</span>
          <input formControlName="city" type="text"
            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100" />
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-slate-700">Quan/huyen</span>
          <input formControlName="district" type="text"
            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100" />
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-slate-700">Phuong/xa</span>
          <input formControlName="ward" type="text"
            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100" />
        </label>
      </div>

      <label class="block">
        <span class="mb-2 block text-sm font-semibold text-slate-700">Dia chi day du</span>
        <textarea formControlName="address" rows="2"
          class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100"></textarea>
      </label>

      <div class="grid gap-4 md:grid-cols-2">
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-slate-700">Khoang gia</span>
          <input formControlName="price_range" type="text" placeholder="VD: 50.000 - 150.000"
            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100" />
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-slate-700">Tien ich (tach boi dau phay)</span>
          <input formControlName="amenities_text" type="text" placeholder="Wifi, May lanh, Cho dau xe"
            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100" />
        </label>
      </div>

      <div class="grid gap-4 md:grid-cols-2">
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-slate-700">Website</span>
          <input formControlName="website" type="text"
            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100" />
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-slate-700">Link Google Maps</span>
          <input formControlName="google_maps_link" type="text"
            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100" />
        </label>
      </div>

      <label class="block">
        <span class="mb-2 block text-sm font-semibold text-slate-700">Mo ta ngan</span>
        <textarea formControlName="description" rows="4"
          class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-orange-300 focus:ring-2 focus:ring-orange-100"></textarea>
      </label>

      <div *ngIf="submitError()" class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
        {{ submitError() }}
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <button type="submit" [disabled]="submitting()"
          class="inline-flex items-center gap-2 rounded-xl bg-orange-500 px-6 py-3 text-sm font-bold text-white transition hover:bg-orange-600 disabled:cursor-not-allowed disabled:opacity-70">
          <i [class]="submitting() ? 'fa-solid fa-spinner animate-spin' : 'fa-solid fa-paper-plane'"></i>
          {{ submitting() ? 'Dang gui...' : 'Gui dang ky' }}
        </button>
        <a routerLink="/" class="text-sm font-semibold text-slate-500 transition hover:text-slate-700">Quay ve trang chu</a>
      </div>
    </form>
  </section>
</div>
