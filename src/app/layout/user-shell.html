<header class="fixed left-0 right-0 top-0 z-[90] h-20 bg-white shadow-sm">
  <app-header />
</header>
<div class="flex min-h-screen pt-20">
  <div class="fixed inset-0 z-[95] bg-slate-900/40 backdrop-blur-[1px] md:hidden" [class.hidden]="!mobileSidebarOpen()"
    [attr.aria-hidden]="!mobileSidebarOpen()" (click)="closeMobileSidebar()"></div>
  <button type="button" (click)="closeMobileSidebar()" [class.hidden]="!mobileSidebarOpen()"
    [attr.aria-hidden]="!mobileSidebarOpen()"
    class="fixed right-4 top-4 z-[97] flex h-10 w-10 items-center justify-center rounded-full bg-white text-slate-700 shadow-lg md:hidden">
    <i class="fa-solid fa-xmark"></i>
  </button>
  <aside
    class="fixed bottom-0 left-0 top-0 z-[96] max-w-72 -translate-x-full overflow-y-auto bg-white transition-transform duration-200 md:hidden"
    [class.translate-x-0]="mobileSidebarOpen()">
    <app-aside></app-aside>
  </aside>
  <aside
    class="fixed bottom-0 left-0 top-20 z-40 hidden w-64 overflow-y-auto border-r border-slate-100 bg-white md:flex md:flex-col">
    <app-aside></app-aside>
  </aside>

  <main class="w-full flex-1 md:pl-64">
    <router-outlet />
  </main>
</div>
<app-tabbar />
<app-auth-required-alert />
