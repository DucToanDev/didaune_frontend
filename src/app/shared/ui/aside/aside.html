<aside class="relative flex min-h-full w-64 flex-col bg-white md:w-full">
  <div class="px-5 py-5 lg:py-4">
    <a
      routerLink="/"
      (click)="closeMobileSidebar()"
      class="mb-6 flex items-center border-b px-4 py-1 lg:hidden">
      <img src="logo.svg" alt="didaune" class="h-14 w-auto" />
    </a>

    <nav class="mb-8 flex flex-col gap-1">
      <a
        routerLink="/"
        (click)="closeMobileSidebar()"
        routerLinkActive="bg-primary_light text-primary"
        [routerLinkActiveOptions]="{ exact: true }"
        class="group flex items-center gap-3 rounded-xl px-4 py-3 font-medium text-slate-600 transition hover:bg-slate-50 hover:text-primary">
        <i class="fa-solid fa-house text-lg"></i>
        Trang chủ
      </a>
      <a
        routerLink="/discover"
        routerLinkActive="bg-primary_light text-primary"
        (click)="onCategoryClick('all')"
        class="group flex cursor-pointer items-center gap-3 rounded-xl px-4 py-3 font-medium text-slate-600 transition hover:bg-slate-50 hover:text-primary">
        <i class="fa-solid fa-compass text-lg"></i>
        Khám phá
      </a>

      <a
        routerLink="/favorite"
        routerLinkActive="bg-primary_light text-primary"
        (click)="closeMobileSidebar()"
        class="group flex cursor-pointer items-center gap-3 rounded-xl px-4 py-3 font-medium text-slate-600 transition hover:bg-slate-50 hover:text-primary">
        <i class="fa-solid fa-heart text-lg"></i>
        Yêu thích
      </a>

      <a
        routerLink="/planner"
        (click)="closeMobileSidebar()"
        routerLinkActive="bg-primary_light text-primary"
        class="group flex items-center gap-3 rounded-xl px-4 py-3 font-medium text-slate-600 transition hover:bg-slate-50 hover:text-primary">
        <i class="fa-solid fa-location-dot text-lg"></i>
        Tạo lịch trình
      </a>
      <a
        routerLink="/map"
        (click)="closeMobileSidebar()"
        routerLinkActive="bg-primary_light text-primary"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-left font-medium text-slate-600 transition hover:bg-slate-50 hover:text-slate-700">
        <i class="fa-solid fa-map-location-dot w-5 text-center"></i>
        Bản đồ
      </a>
      <a
        routerLink="/decision"
        (click)="closeMobileSidebar()"
        routerLinkActive="bg-primary_light text-primary"
        class="group flex items-center gap-3 rounded-xl px-4 py-3 font-medium text-slate-600 transition hover:bg-slate-50 hover:text-primary">
        <i class="fa-solid fa-box text-lg"></i>
        Tạo phòng cùng đi
      </a>
      <a
        routerLink="/about"
        (click)="closeMobileSidebar()"
        routerLinkActive="bg-primary_light text-primary"
        class="group flex items-center gap-3 rounded-xl px-4 py-3 font-medium text-slate-600 transition hover:bg-slate-50 hover:text-primary">
        <i class="fa-solid fa-circle-info text-lg"></i>
        Đội ngũ
      </a>
      <a
        routerLink="/contact"
        (click)="closeMobileSidebar()"
        routerLinkActive="bg-primary_light text-primary"
        class="group flex items-center gap-3 rounded-xl px-4 py-3 font-medium text-slate-600 transition hover:bg-slate-50 hover:text-primary">
        <i class="fa-solid fa-address-book text-lg"></i>
        Liên hệ
      </a>
      <a
        routerLink="/policy"
        (click)="closeMobileSidebar()"
        routerLinkActive="bg-primary_light text-primary"
        class="group flex items-center gap-3 rounded-xl px-4 py-3 font-medium text-slate-600 transition hover:bg-slate-50 hover:text-primary">
        <i class="fa-solid fa-file-contract text-lg"></i>
        Chính sách
      </a>
    </nav>

      <h3
        class="mb-4 px-4 text-[12px] font-bold uppercase tracking-widest text-slate-400">

        <button
          *ngFor="let category of primaryCategories"

          <i [class]="'fa-solid ' + category.icon"></i>
          {{ category.label }}
        </button>
      </div>
    </div> -->
  </div>
</aside>
