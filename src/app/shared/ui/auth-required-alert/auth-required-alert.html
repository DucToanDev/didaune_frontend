<div
  *ngIf="dataService.protectedAuthPrompt() as prompt"
  class="auth-required-alert__overlay fixed inset-0 z-[2147483647] flex items-center justify-center bg-slate-900/45 p-4 backdrop-blur-sm">
  <div
    class="auth-required-alert__card w-full max-w-[360px] overflow-hidden rounded-[28px] border border-white/60 bg-white/85 shadow-[0_30px_80px_rgba(0,0,0,0.28)] backdrop-blur-2xl">
    <div class="px-6 pt-6 text-center">
      <div
        class="auth-required-alert__icon mx-auto flex h-16 w-16 items-center justify-center rounded-[22px] bg-[linear-gradient(180deg,#fff7ed_0%,#ffedd5_100%)] text-[28px] text-amber-500 shadow-[inset_0_1px_0_rgba(255,255,255,0.85)]">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="mt-4 text-[20px] font-semibold tracking-[-0.02em] text-slate-900">
        {{ prompt.title }}
      </h2>
      <p class="mt-2 text-[15px] leading-6 text-slate-500">
        {{ prompt.description }}
      </p>
    </div>

    <div class="auth-required-alert__actions mt-6 grid grid-cols-2 gap-3 border-t border-slate-200/80 px-4 py-4">
      <button
        type="button"
        (click)="dataService.dismissProtectedAuthPrompt()"
        class="rounded-2xl bg-slate-100 px-4 py-3 text-sm font-semibold text-slate-600 transition hover:bg-slate-200">
        Để sau
      </button>
      <button
        type="button"
        (click)="dataService.confirmProtectedAuthPrompt()"
        class="rounded-2xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white shadow-[0_12px_30px_rgba(15,23,42,0.22)] transition hover:bg-slate-800">
        {{ prompt.confirmText }}
      </button>
    </div>
  </div>
</div>
